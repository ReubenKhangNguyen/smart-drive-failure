name: smart-drive-failure

x-hadoop-common: &hadoop-common
  image: bde2020/hadoop-base:2.0.0-hadoop3.2.1-java8
  networks:
    - smart-drive-net

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: Dockerfile.spark
  image: smart-drive-failure-spark:3.5.1-numpy
  depends_on:
    namenode:
      condition: service_started
  environment:
    HADOOP_CONF_DIR: /opt/spark/conf/hadoop
  volumes:
    - ./config/hadoop:/opt/spark/conf/hadoop:ro
    - .:/opt/smart-drive:ro
    - ./artifacts:/opt/smart-drive/artifacts
  working_dir: /opt/smart-drive
  networks:
    - smart-drive-net

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: smart-drive-failure-airflow:2.10.5
  profiles:
    - orchestration
  environment: &airflow-env
    # SQLite + SequentialExecutor: enough for one sequential demo DAG (Airflow docs: SQLite only works with the
    # SequentialExecutor and is never for production). One webserver worker keeps RAM low.
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    HADOOP_CONF_DIR: /opt/spark/conf/hadoop
    # the Spark driver runs inside the scheduler container (standalone has no cluster mode for Python apps);
    # executors connect back to it by this name on smart-drive-net
    SPARK_DRIVER_HOST: airflow-scheduler
  volumes:
    - airflow_home:/opt/airflow
    - ./dags:/opt/airflow/dags:ro
    - ./config/hadoop:/opt/spark/conf/hadoop:ro
    - .:/opt/smart-drive:ro
    - ./artifacts:/opt/smart-drive/artifacts
  working_dir: /opt/smart-drive
  networks:
    - smart-drive-net

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-namenode
    environment:
      CLUSTER_NAME: smart-drive
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    ports:
      - "${NAMENODE_WEB_PORT:-9870}:9870"
      - "${NAMENODE_RPC_PORT:-9000}:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - "C:/dataset_smart_drive_failure/data_Q1_2026:/external_data:ro"
      - "C:/dataset_smart_drive_failure/data_Q2_2026:/external_data_q2:ro"
    networks:
      - smart-drive-net
    restart: unless-stopped

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-datanode1
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - datanode1_data:/hadoop/dfs/data
    networks:
      - smart-drive-net
    restart: unless-stopped

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-datanode2
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - datanode2_data:/hadoop/dfs/data
    networks:
      - smart-drive-net
    restart: unless-stopped

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-datanode3
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - datanode3_data:/hadoop/dfs/data
    networks:
      - smart-drive-net
    restart: unless-stopped

  spark-master:
    <<: *spark-common
    container_name: smart-drive-spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_WEB_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    restart: unless-stopped

  spark-worker1:
    <<: *spark-common
    container_name: smart-drive-spark-worker1
    hostname: spark-worker1
    depends_on:
      spark-master:
        condition: service_started
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    restart: unless-stopped

  spark-worker2:
    <<: *spark-common
    container_name: smart-drive-spark-worker2
    hostname: spark-worker2
    depends_on:
      spark-master:
        condition: service_started
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    restart: unless-stopped

  ui-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-drive-ui-dashboard
    depends_on:
      - namenode
    environment:
      HDFS_NAMENODE_URL: http://namenode:9870
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./ui_dashboard:/app/ui_dashboard:ro
      - ./artifacts:/app/artifacts:ro
    command: streamlit run ui_dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    networks:
      - smart-drive-net
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: smart-drive-tests
    profiles:
      - test
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
    volumes:
      - ./config/hadoop:/opt/spark/conf/hadoop:ro
      - .:/opt/smart-drive:ro
      - ./artifacts:/opt/smart-drive/artifacts
    working_dir: /opt/smart-drive
    networks:
      - smart-drive-net
    command: ["python3", "-m", "pytest", "-q"]

  airflow-init:
    <<: *airflow-common
    container_name: smart-drive-airflow-init
    restart: "no"
    environment:
      <<: *airflow-env
      # read from the environment (.env); never written in this file. Empty makes the init step fail with a message.
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        test -n "$${AIRFLOW_ADMIN_PASSWORD:-}" || { echo "AIRFLOW_ADMIN_PASSWORD is not set: put it in .env (see .env.example)" >&2; exit 1; }
        airflow db migrate
        airflow pools set spark_cluster 1 "One Spark job at a time"
        airflow users list 2>/dev/null | grep -qw admin || airflow users create --username admin --password "$$AIRFLOW_ADMIN_PASSWORD" --firstname Admin --lastname Demo --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    container_name: smart-drive-airflow-webserver
    command: ["airflow", "webserver", "--port", "8080"]
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8081}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    container_name: smart-drive-airflow-scheduler
    hostname: airflow-scheduler
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: "no"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: smart-drive-zookeeper
    profiles:
      - streaming
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # KAFKA_HEAP_OPTS is the variable zookeeper-server-start reads (image default -Xmx512M -Xms512M)
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    networks:
      - smart-drive-net
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: smart-drive-kafka
    profiles:
      - streaming
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # 127.0.0.1, not localhost: on Windows `localhost` resolves to ::1 first, and the port is published on the IPv4
      # loopback only, so a host client advertised `localhost:9092` was refused (measured: 127.0.0.1 connects, ::1 does not)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # KAFKA_HEAP_OPTS is the variable kafka-server-start reads (image default -Xmx1G -Xms1G)
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    networks:
      - smart-drive-net
    restart: "no"

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:
  airflow_home:

networks:
  smart-drive-net:
    driver: bridge
