name: smart-drive-failure

x-hadoop-common: &hadoop-common
  image: bde2020/hadoop-base:2.0.0-hadoop3.2.1-java8
  networks:
    - smart-drive-net

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: Dockerfile.spark
  image: smart-drive-failure-spark:3.5.1-numpy
  depends_on:
    namenode:
      condition: service_started
  environment:
    HADOOP_CONF_DIR: /opt/spark/conf/hadoop
  volumes:
    - ./config/hadoop:/opt/spark/conf/hadoop:ro
    - .:/opt/smart-drive:ro
    - ./artifacts:/opt/smart-drive/artifacts
  working_dir: /opt/smart-drive
  networks:
    - smart-drive-net

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-namenode
    environment:
      CLUSTER_NAME: smart-drive
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    ports:
      - "${NAMENODE_WEB_PORT:-9870}:9870"
      - "${NAMENODE_RPC_PORT:-9000}:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - "C:/dataset_smart_drive_failure/data_Q1_2026:/external_data:ro"
    networks:
      - smart-drive-net
    restart: unless-stopped

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-datanode1
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - datanode1_data:/hadoop/dfs/data
    networks:
      - smart-drive-net
    restart: unless-stopped

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-datanode2
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - datanode2_data:/hadoop/dfs/data
    networks:
      - smart-drive-net
    restart: unless-stopped

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: smart-drive-datanode3
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: ${HDFS_REPLICATION_FACTOR:-2}
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
    volumes:
      - datanode3_data:/hadoop/dfs/data
    networks:
      - smart-drive-net
    restart: unless-stopped

  spark-master:
    <<: *spark-common
    container_name: smart-drive-spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_WEB_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    restart: unless-stopped

  spark-worker1:
    <<: *spark-common
    container_name: smart-drive-spark-worker1
    hostname: spark-worker1
    depends_on:
      spark-master:
        condition: service_started
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    restart: unless-stopped

  spark-worker2:
    <<: *spark-common
    container_name: smart-drive-spark-worker2
    hostname: spark-worker2
    depends_on:
      spark-master:
        condition: service_started
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    restart: unless-stopped

  ui-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-drive-ui-dashboard
    depends_on:
      - namenode
    environment:
      HDFS_NAMENODE_URL: http://namenode:9870
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./ui_dashboard:/app/ui_dashboard:ro
      - ./artifacts:/app/artifacts:ro
    command: streamlit run ui_dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    networks:
      - smart-drive-net
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: smart-drive-tests
    profiles:
      - test
    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
    volumes:
      - ./config/hadoop:/opt/spark/conf/hadoop:ro
      - .:/opt/smart-drive:ro
      - ./artifacts:/opt/smart-drive/artifacts
    working_dir: /opt/smart-drive
    networks:
      - smart-drive-net
    command: ["python3", "-m", "pytest", "-q"]

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:

networks:
  smart-drive-net:
    driver: bridge
